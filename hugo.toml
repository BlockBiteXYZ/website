[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  # Self-hosted Inter (no requests to Google Fonts)
  [[module.mounts]]
    source = 'node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'
    target = 'static/fonts/inter/inter-latin-wght-normal.woff2'
  [[module.mounts]]
    source = 'node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2'
    target = 'static/fonts/inter/inter-latin-ext-wght-normal.woff2'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/lucide'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/font-awesome'
[security]
  allowContent = ['^text/html$', '^text/markdown$']
  [security.exec]
    # Newer Hugo versions no longer allow tailwindcss by default
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']