{{ define "title" }}{{ i18n "notFoundTitle" }} | {{ .Site.Title }}{{ end }}
{{ define "content" }}
<article class="w-full flex flex-col items-center justify-center gap-6 min-h-[60svh] text-center">
  <p class="pt-0 font-bold text-6xl md:text-8xl">404</p>
  <h1 class="pt-0 font-normal">{{ i18n "notFoundHeading" }}</h1>
  <p class="pt-0 text-neutral-500">{{ i18n "notFoundText" }}</p>
  <a
    href="{{ site.Home.RelPermalink }}"
    class="no-underline font-medium px-6 py-3 rounded-full bg-black text-white dark:bg-white dark:text-black hover:opacity-80 transition-opacity"
  >
    {{ i18n "backToHome" }}
  </a>
</article>
{{ end }}
