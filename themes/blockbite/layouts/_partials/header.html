<script>
  function toggleTheme() {
    localStorage.theme === "dark"
      ? (localStorage.theme = "light")
      : (localStorage.theme = "dark");
    document.documentElement.classList.toggle("dark");
  }

  function toggleMenu() {
    document.getElementById("slide-menu").classList.toggle("left-full")
    document.getElementById("slide-menu").classList.toggle("left-0")
  }

  function updateHeader() {
    document.getElementById("site-header").classList.toggle("scrolled", window.scrollY > 10);
  }
  window.addEventListener("scroll", updateHeader, { passive: true });
  window.addEventListener("DOMContentLoaded", updateHeader);

  document.addEventListener("click", (e) => {
    document.querySelectorAll("details.lang-switch[open]").forEach((d) => {
      if (!d.contains(e.target)) d.removeAttribute("open");
    });
  });
</script>
<nav class="grid grid-cols-3">
  <a
    class="w-50 lg:w-70 object-scale-down place-items-center cursor-pointer content-center"
    href="{{ site.Home.RelPermalink }}"
  >
    <img
      class="dark:invert"
      src="{{ .Site.Params.logo | relURL }}"
      alt="{{ .Site.Title }}"
    />
  </a>
  {{ with site.Menus.main }}
  <div
    class="flex flex-row justify-evenly grow text-md sm:text-sm lg:text-xl place-items-center hidden sm:flex col-span-2"
  >
    {{ range . }}
    <a class="hover:underline no-underline cursor-pointer" href="{{ .URL }}" data-umami-event="nav-{{ .Name | urlize }}">
      {{ .Name }}</a
    >
    / {{ end }}
    {{ with $.Translations }}{{ partial "lang-switch.html" $ }} / {{ end }}
    <button type="button" class="cursor-pointer" onclick="toggleTheme()" aria-label="{{ i18n "toggleDarkMode" }}">
      <span class="hidden dark:block">
        {{ $ctx := dict "vendor" "lucide" "name" "sun" }} {{ partial
        "icons/icon" $ctx }}
      </span>
      <span class="dark:hidden">
        {{ $ctx := dict "vendor" "lucide" "name" "moon" }} {{ partial
        "icons/icon" $ctx }}
      </span>
    </button>
  </div>
  <button type="button" class="sm:hidden justify-self-end col-span-2 cursor-pointer" onclick="toggleMenu()" aria-label="{{ i18n "openMenu" }}">
    {{ $ctx := dict "vendor" "lucide" "name" "menu" "size" "2em" }} {{ partial "icons/icon" $ctx }}
  </button>
  <div
    id="slide-menu"
    class="z-40 fixed top-0 left-full w-screen h-screen transition-[left] bg-white dark:bg-black p-10 grid grid-row content-start place-items-center gap-4 text-black dark:text-white"
  >
    <div class="w-full grid grid-flow-col items-center">
      <button type="button" class="cursor-pointer justify-self-start" onclick="toggleTheme()" aria-label="{{ i18n "toggleDarkMode" }}">
        <span class="hidden dark:block">
          {{ $ctx := dict "vendor" "lucide" "name" "sun" "size" "2em"}} {{
          partial "icons/icon" $ctx }}
        </span>
        <span class="dark:hidden">
          {{ $ctx := dict "vendor" "lucide" "name" "moon" "size" "2em"}} {{
          partial "icons/icon" $ctx }}
        </span>
      </button>
      {{ with $.Translations }}<div class="justify-self-center text-xl">{{ partial "lang-switch.html" $ }}</div>{{ end }}
      <button type="button" class="cursor-pointer justify-self-end" onclick="toggleMenu()" aria-label="{{ i18n "closeMenu" }}">
        {{ $ctx := dict "vendor" "lucide" "name" "x" "size" "2em" }} {{ partial "icons/icon" $ctx }}
      </button>
    </div>
    <h4 class="pt-0">
      <a class="hover:underline no-underline cursor-pointer" href="{{ site.Home.RelPermalink }}" onclick="toggleMenu()">
        {{ i18n "home" }}</a
      >
    </h4>
    {{ range . }}
    <h4 class="pt-0">
      <a class="hover:underline no-underline cursor-pointer" href="{{ .URL }}" onclick="toggleMenu()" data-umami-event="nav-{{ .Name | urlize }}">
        {{ .Name }}</a
      >
    </h4>
    {{ end }}
  </div>
  {{ end }}
</nav>
