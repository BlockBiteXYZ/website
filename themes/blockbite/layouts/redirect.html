{{- /* Former subpages now live as sections on the homepage. GitHub Pages can't send 301s, so redirect with a meta refresh. */ -}}
{{- $target := printf "%s#%s" site.Home.Permalink .File.ContentBaseName -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <title>{{ .Title }} | {{ site.Title }}</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ site.Home.Permalink }}">
    <meta http-equiv="refresh" content="0; url={{ $target }}">
  </head>
  <body>
    <p><a href="{{ $target }}">{{ .Title }}</a></p>
  </body>
</html>
